org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# nanoMuse: a newer lint than AGP 8.7.3 bundles (31.7.3). The Compose and lifecycle libraries ship
# lint checks compiled against a newer Kotlin analysis API, and the bundled lint crashes on them
# (IncompatibleClassChangeError in the detectors, `./gradlew :app:lintDebug` never finished). The
# property takes an AGP-style version: 8.13.0 is lint 31.13.0, which reads them; AGP itself is unchanged.
android.experimental.lint.version=8.13.0
