name: Upstream Sync

on:
  schedule:
    # 每小时错峰检查一次（第 17 分钟，避免整点排队拥堵）
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Sync from Upstream
        id: sync
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 若配置了具备 workflow 权限的 SYNC_PAT，优先使用该凭据认证
          if [ -n "$SYNC_PAT" ]; then
            echo "检测到 SYNC_PAT，配置 origin 认证凭据与 GH_TOKEN..."
            export GH_TOKEN="$SYNC_PAT"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
          fi

          # 1. 确保并拉取官方上游
          git remote add upstream https://github.com/nano-muse/nanoMuse.git || git remote set-url upstream https://github.com/nano-muse/nanoMuse.git
          git fetch upstream main --tags

          LOCAL_HASH=$(git rev-parse HEAD)
          UPSTREAM_HASH=$(git rev-parse upstream/main)

          echo "Local main: $LOCAL_HASH"
          echo "Upstream main: $UPSTREAM_HASH"

          UPSTREAM_RELEASE_TAG=$(gh release view -R "nano-muse/nanoMuse" --json tagName --jq '.tagName' 2>/dev/null || true)
          LOCAL_RELEASE_TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' 2>/dev/null || true)
          UPSTREAM_TAG="${UPSTREAM_RELEASE_TAG:-$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "main-latest")}"

          echo "Official release: $UPSTREAM_RELEASE_TAG"
          echo "Local release: $LOCAL_RELEASE_TAG"

          # 清理函数：当 main 已包含最新上游提交时，自动关闭遗留的冲突 PR 并清理分支
          cleanup_sync_prs() {
            echo "检查是否存在待清理的历史冲突同步 PR 与临时分支..."
            OPEN_SYNC_PRS=$(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("sync/upstream")) | .number' 2>/dev/null || true)
            for PR_NO in $OPEN_SYNC_PRS; do
              echo "自动关闭已解决的冲突 PR #$PR_NO..."
              gh pr close "$PR_NO" --comment "✅ 上游更新已合入主分支 \`main\`，自动关闭此同步 PR 并清理临时分支。" --delete-branch || true
            done

            # 清理远端残余的 sync/upstream 同步分支
            git push origin --delete sync/upstream 2>/dev/null || true
          }

          # 检查是否真正有官方新 Release 需要触发打包发布
          check_and_trigger_release() {
            if [ -n "$UPSTREAM_RELEASE_TAG" ] && [ "$UPSTREAM_RELEASE_TAG" != "$LOCAL_RELEASE_TAG" ]; then
              if git merge-base --is-ancestor "$UPSTREAM_RELEASE_TAG" HEAD 2>/dev/null; then
                echo "检测到官方发布了新版本 $UPSTREAM_RELEASE_TAG（当前仓库尚未发布），触发 release-apk 打包发布流水线..."
                gh workflow run release-apk.yml -R "$GITHUB_REPOSITORY" -f release_tag="$UPSTREAM_RELEASE_TAG" || true
              fi
            fi
          }

          # 如果本地已包含上游所有更新，清理历史冲突 PR 并检查官方最新发布是否在本仓库已发布
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "本地 main 分支已包含官方所有最新提交。"
            cleanup_sync_prs
            check_and_trigger_release
            exit 0
          fi

          NEW_COMMITS=$(git log --oneline HEAD..upstream/main -n 10)

          echo "检测到官方有新更新，尝试自动无损合并..."

          # 2. 尝试自动合并
          if git merge --no-edit upstream/main; then
            echo "自动合并成功，推送到 origin/main..."
            if ! git push origin main --tags; then
              echo "::error::推送失败。若上游更新包含工作流文件（.github/workflows/），默认 GITHUB_TOKEN 无权修改 workflow 文件。请在仓库配置拥有 workflow 权限的 Personal Access Token (Secret: SYNC_PAT)，或在本地执行 git merge upstream/main && git push 推送。"
              exit 1
            fi
            cleanup_sync_prs
            check_and_trigger_release

            # 合并成功：发送 Telegram 简报通知（若已配置）
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              NM_TAG="$UPSTREAM_TAG" NM_COMMITS="$NEW_COMMITS" python3 -c "
              import os, urllib.request, json
              token = os.environ['TELEGRAM_BOT_TOKEN']
              chat_id = os.environ['TELEGRAM_CHAT_ID']
              tag = os.environ['NM_TAG']
              commits = os.environ['NM_COMMITS']
              text = f'🎉 *nanoMuse 官方更新已自动合并*\n\n📌 *上游最新标签*: \`{tag}\`\n📝 *新提交概览*:\n\`\`\`\n{commits}\n\`\`\`\n已成功无损合并至主分支 \`main\`。'
              data = json.dumps({'chat_id': chat_id, 'text': text, 'parse_mode': 'Markdown'}).encode('utf-8')
              req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type': 'application/json'})
              try:
                  urllib.request.urlopen(req, timeout=15)
              except Exception as e:
                  print('Telegram notify failed:', e)
              " || true
            fi
            exit 0
          fi

          # 3. 检测到冲突：取消合并，管理冲突分支与 PR 生命周期
          echo "⚠️ 自动合并检测到代码冲突，取消当前合并..."
          git merge --abort

          BRANCH_NAME="sync/upstream"

          # 检查是否已有针对该分支打开的冲突 PR
          EXISTING_PR_JSON=$(gh pr list --head "$BRANCH_NAME" --state open --json number,url --jq '.[0]' 2>/dev/null || true)
          EXISTING_PR_NUM=$(echo "$EXISTING_PR_JSON" | jq -r '.number // empty' 2>/dev/null || true)
          EXISTING_PR_URL=$(echo "$EXISTING_PR_JSON" | jq -r '.url // empty' 2>/dev/null || true)

          # 检查远端 sync/upstream 分支是否已存在且与当前上游提交一致
          REMOTE_SYNC_HASH=$(git ls-remote origin "refs/heads/$BRANCH_NAME" 2>/dev/null | cut -f1 || true)

          if [ -n "$EXISTING_PR_NUM" ] && [ "$REMOTE_SYNC_HASH" = "$UPSTREAM_HASH" ]; then
            echo "冲突 PR #${EXISTING_PR_NUM} (${EXISTING_PR_URL}) 处于待裁决状态，且上游无新提交变化，无需重复推送或告警。"
            exit 0
          fi

          # 切换或创建固定冲突同步分支，并强制同步至最新 upstream/main
          git checkout -B "$BRANCH_NAME" upstream/main
          git push origin "$BRANCH_NAME" --force

          PR_TITLE="⚠️ [需裁决] 自动同步官方新版本冲突 (${UPSTREAM_TAG})"

          if [ -n "$EXISTING_PR_NUM" ]; then
            echo "更新现有冲突 PR #${EXISTING_PR_NUM}..."
            PR_URL="$EXISTING_PR_URL"
            gh pr comment "$EXISTING_PR_NUM" --body "🔄 检测到官方上游有新提交，分支 \`$BRANCH_NAME\` 已强制同步更新（最新标签：\`${UPSTREAM_TAG}\`）。请及时合并裁决。" || true
          else
            # 构造 PR Body
            {
              echo "## 官方仓库有新更新，自动合并时检测到冲突"
              echo ""
              echo "### 上游最新信息"
              echo "- 目标合并分支: \`main\`"
              echo "- 上游同步分支: \`sync/upstream\`"
              echo ""
              echo "### 如何解决冲突？"
              echo "1. 本地拉取该分支解决："
              echo "   \`\`\`bash"
              echo "   git fetch origin"
              echo "   git checkout main"
              echo "   git merge origin/sync/upstream"
              echo "   git push origin main"
              echo "   \`\`\`"
              echo "2. 或直接在下方 GitHub 网页点击 **Resolve conflicts** 在线裁决。"
            } > /tmp/pr_body.md

            PR_URL=$(gh pr create --base main --head "$BRANCH_NAME" --title "$PR_TITLE" --body-file /tmp/pr_body.md)
            echo "Pull Request 已创建: $PR_URL"
          fi

          # 4. 发送 Telegram 冲突告警
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            NM_TAG="$UPSTREAM_TAG" NM_COMMITS="$NEW_COMMITS" NM_PR_URL="$PR_URL" python3 -c "
            import os, urllib.request, json
            token = os.environ['TELEGRAM_BOT_TOKEN']
            chat_id = os.environ['TELEGRAM_CHAT_ID']
            tag = os.environ['NM_TAG']
            commits = os.environ['NM_COMMITS']
            pr = os.environ['NM_PR_URL']
            text = f'⚠️ *nanoMuse 官方同步冲突提醒*\n\n官方发布了新版本（\`{tag}\`），自动合并到 \`main\` 时发生冲突！\n\n🔗 [点击查看并裁决 PR]({pr})\n\n📝 *上游提交简报*:\n\`\`\`\n{commits}\n\`\`\`\n请点击上方链接进行裁决。'
            data = json.dumps({'chat_id': chat_id, 'text': text, 'parse_mode': 'Markdown'}).encode('utf-8')
            req = urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type': 'application/json'})
            try:
                urllib.request.urlopen(req, timeout=15)
            except Exception as e:
                print('Telegram notify failed:', e)
            " || true
          else
            echo "未配置 TELEGRAM_BOT_TOKEN 或 TELEGRAM_CHAT_ID，跳过 Telegram 发送。"
          fi
