name: Labels

# Every pull request carries labels: the platforms from the files it touches (.github/labeler.yml)
# and its kind from the title (feat is enhancement, fix is bug, docs is documentation, ci is ci,
# build(release) is release, the other types are maintenance). Labels are only added, never
# removed, so a maintainer's hand-set labels stay. pull_request_target runs this on main's copy
# of the workflow with the token it needs; it checks out nothing from the pull request.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Platform and kind
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Platforms, from the files touched
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
      - name: Kind, from the title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          kind=""
          re='^([a-z]+)(\(([^)]*)\))?!?: '
          if [[ "$TITLE" =~ $re ]]; then
            type="${BASH_REMATCH[1]}"
            scope="${BASH_REMATCH[3]}"
            case "$type" in
              feat) kind=enhancement ;;
              fix) kind=bug ;;
              docs) kind=documentation ;;
              ci) kind=ci ;;
              build|chore|refactor|test|style|perf|revert)
                if [[ "$scope" == *release* ]]; then kind=release; else kind=maintenance; fi ;;
            esac
          fi
          have=$(gh pr view "$NUMBER" --repo "$REPO" --json labels --jq '.labels[].name')
          if [[ -n "$kind" ]] && ! grep -qx "$kind" <<<"$have"; then
            gh pr edit "$NUMBER" --repo "$REPO" --add-label "$kind"
            have="$have"$'\n'"$kind"
          fi
          if [[ -z "$(tr -d '[:space:]' <<<"$have")" ]]; then
            gh pr edit "$NUMBER" --repo "$REPO" --add-label maintenance
          fi
