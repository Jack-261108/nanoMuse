name: Commits

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# a newer push to the same pull request cancels the check of the commit it replaced; the new
# commit gets its own run, so the required check never goes missing
concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    name: Signed-off-by on every commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the Developer Certificate of Origin sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
      - name: Check the subject line (Conventional Commits)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s\n' "$subject" | grep -qE '^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9/_.,-]*\))?!?: [^ ].*|Revert ".*)$'; then
              echo "::error::commit $sha: subject \"$subject\" is not type(scope): subject (CONTRIBUTING.md, Commits)"
              bad=1
            fi
          done
          exit $bad
