# Platform labels for pull requests, from the files a pull request touches (actions/labeler).
# The kind label (bug, enhancement, documentation, ci, release, maintenance) comes from the title;
# see .github/workflows/labels.yml and CONTRIBUTING.md, "Issues and pull requests (maintainers)".

android:
  - changed-files:
      - any-glob-to-any-file:
          - "android/src/android/**"
          - "android/deps/**"
          - "android/scripts/**"
          - "scripts/android/**"
          - "scripts/release-apk.sh"
          # the rebrand writes both phones' trees (android.yml rebuilds on it, too)
          - "scripts/rebrand.py"
          - "scripts/gen-android-icons.py"
          - ".github/workflows/android.yml"

ios:
  - changed-files:
      - any-glob-to-any-file:
          - "android/src/ios/**"
          - "scripts/rebrand.py"
          - "scripts/gen-ios-icons.py"
          - ".github/workflows/ios-*.yml"

desktop:
  - changed-files:
      - any-glob-to-any-file:
          - "harness/**"
          - ".github/workflows/desktop-app.yml"
          - ".github/workflows/harness.yml"

web:
  - changed-files:
      - any-glob-to-any-file:
          - "web/**"
          - "nanomuse/server/static/**"
          - "demo/**"

runtime:
  - changed-files:
      - any-glob-to-any-file:
          # nanomuse/ without nanomuse/server/static/, the committed web build (that is `web`,
          # above): the four globs together cover every other file under nanomuse/
          - "nanomuse/*"
          - "nanomuse/!(server)/**"
          - "nanomuse/server/*"
          - "nanomuse/server/!(static)/**"
          - "tests/**"
          - "pyproject.toml"
          - "Dockerfile"
          - "docker-compose.yml"

cloud:
  - changed-files:
      - any-glob-to-any-file:
          - "cloud/**"
