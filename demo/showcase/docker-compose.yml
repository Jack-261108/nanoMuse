# The public nanoMuse showcase: a phone in the browser (MobileGym with the nanoMuse app) and a
# private, short-lived nanoMuse per visitor. See README.md for the whole picture and the
# deployment steps.
#
#   cp .env.example .env && $EDITOR .env
#   docker pull ghcr.io/nano-muse/nanomuse:latest        # what the visitors' sessions run
#   docker compose pull && docker compose up -d          # published images (see showcase.yml)
#   docker compose up -d --build                         # or build both images here
#
# Sessions are started by the gateway on the `nanomuse-sessions` network, which has no way out:
# the only thing a visitor's Muse can talk to is the gateway (and through it, the model).
# With WEB_ENABLED=1 the gateway also runs nanoMuse Web — a kept Muse per Cloud account, on
# the `nanomuse-web` network next to the relay (gateway/showcase_gateway/accounts.py).
# The gateway reaches Docker through `docker-proxy`, which lets through what starting and
# stopping containers takes and nothing else of the daemon (no exec, images, volumes, build).

# The three services' own logs (`docker compose logs`): the gateway writes a line per request
# and per session, so a file that is rolled, not one that grows for as long as the box runs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    build:
      context: ../..
      dockerfile: demo/showcase/caddy/Dockerfile
      args:
        MOBILEGYM_REF: ${MOBILEGYM_REF:-main}
        # the phone's media: /cdn here (./data/mobilegym-data), or https://cdn.mobilegym.dev without the dataset
        MOBILEGYM_CDN_BASE: ${MOBILEGYM_CDN_BASE:-/cdn}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: ghcr.io/nano-muse/showcase-caddy:${SHOWCASE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/mobilegym-data:/srv/cdn:ro
      # other sites on this Caddy: their site blocks, and the files they serve (README, "Other sites")
      - ./sites.d:/etc/caddy/sites.d:ro
      - ${WWW_ROOT:-./www}:/srv/www:ro
      # access logs of the sites that keep one (mirror/nanomuse.cn.caddy), read by mirror/traffic.py
      - ./logs/caddy:/var/log/caddy
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    image: ghcr.io/nano-muse/showcase-gateway:${SHOWCASE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      INTERNAL_URL: http://gateway:8000
      SESSIONS_NETWORK: nanomuse-sessions
      TRUST_PROXY: "1"
      LISTEN_PORT: "8000"
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - gateway-data:/data # SQLite: the visitors and their tickets, trial credentials, kept Muses
    networks:
      - edge
      - sessions
      - web
      - control
    depends_on:
      - docker-proxy

  # the Docker API, narrowed: containers (list, inspect, create, start, stop, remove) and a look
  # at the networks — what the gateway does. Everything else answers 403: exec, images, volumes,
  # build, info, swarm. The socket itself is mounted here only, read-only, on a network of its own.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    logging: *logging
    environment:
      CONTAINERS: "1"
      POST: "1"
      NETWORKS: "1"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control

networks:
  edge: {}
  control:
    internal: true
  sessions:
    name: nanomuse-sessions
    internal: true
  # nanoMuse Web (gateway/accounts.py): the kept, per-account containers live here, together
  # with the Cloud relay they sign in to (cloud/deploy/nanomuse-hk joins it too). Not internal:
  # an account's Muse may fetch pages and talk to the model like one on a phone would.
  web:
    name: nanomuse-web

volumes:
  caddy-data: {}
  caddy-config: {}
  gateway-data: {}
